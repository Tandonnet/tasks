name: Build debug APK

on:
  workflow_dispatch:   # bouton "Run workflow" manuel dans l'onglet Actions
  push:
    branches:
      - main            # adapte au nom de ta branche si besoin

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build generic debug APK
        run: ./gradlew assembleGenericDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: tasks-debug-apk
          path: app/build/outputs/apk/generic/debug/*.apk
